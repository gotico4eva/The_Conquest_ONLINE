<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>The Conquest</title>
    <!-- Página do host (29/10/2026, plano W5): descrição e imagem de compartilhamento (WhatsApp, Discord, iMessage,
         redes) — o link colado mostra o emblema e o nome, não uma caixa vazia. A imagem precisa de endereço absoluto. -->
    <meta name="description" content="The Conquest: a strategy board game for 1 to 6 players. Free beta, plays in your browser.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://play.vitalinsights.com.au/">
    <meta property="og:title" content="The Conquest">
    <meta property="og:description" content="A strategy board game for 1 to 6 players. Free beta, plays in your browser.">
    <meta property="og:image" content="https://play.vitalinsights.com.au/icons/share.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <!-- Instalar na tela inicial (30/09/2026): no iPhone, Compartilhar → "Adicionar à Tela de
         Início" abre o jogo em tela cheia, sem as barras do Safari — some a faixa de cima
         que engolia toques e sobra mais tela. Android/Chrome usa o manifest. -->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="The Conquest">
    <meta name="theme-color" content="#0e0b10">
    <link rel="stylesheet" href="TemplateData/style.css">
    <!-- Viewport is declared up front now (25/09/2026), not injected by script after the
         page starts laying out. The old injected version also carried
         "height=device-height" and "shrink-to-fit=yes": on iOS device-height is ALWAYS the
         portrait height, so after rotating to landscape the page was taller than the
         screen and Safari scrolled it. The picture moved up but taps were still mapped
         as if it hadn't, so every button had to be pressed below where it was drawn
         (Lucas, iPhone, home-screen app). Desktop browsers ignore this tag. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <!-- Carregador com a marca do jogo (29/10/2026) no lugar do logo do Unity. Os ids da barra continuam os do Unity. -->
      <div id="unity-loading-bar">
        <img id="conquest-emblem" src="icons/icon-192.png" alt="">
        <div id="conquest-title">The Conquest</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div id="conquest-status">Loading the board…</div>
      </div>
      <!-- Falha amigável (29/10/2026): no lugar do alert() do Unity, um painel que diz o que fazer. -->
      <div id="conquest-fail" role="alert">
        <img src="icons/icon-192.png" alt="">
        <h1>The Conquest couldn't start</h1>
        <p id="conquest-fail-reason"></p>
        <div id="conquest-fail-buttons">
          <button type="button" id="conquest-retry">Try again</button>
          <button type="button" id="conquest-dismiss">Close</button>
        </div>
        <p id="conquest-fail-detail"></p>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">The_Conquest_Client</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      // Falha amigável (29/10/2026). Classifica a mensagem crua do Unity num motivo que o jogador entende e mostra o painel;
      // a mensagem crua fica em letra pequena embaixo, pra um print de bug. "Close" só aparece se o jogo já tinha aberto.
      var conquestStarted = false;
      function conquestFail(raw) {
        var text = String(raw || "");
        var reason;
        if (/webgl/i.test(text) && /(not|n't|unsupported|disabled|failed to create|context)/i.test(text))
          reason = "This browser can't draw the game (WebGL is off or not supported). Update the browser, or try Chrome, Edge, Firefox or Safari.";
        else if (/(out of memory|memory|array buffer allocation|rangeerror)/i.test(text))
          reason = "Your device ran out of memory while loading. Close other tabs and apps, then try again.";
        else if (/(network|download|fetch|http|failed to load|load failed|cors|timeout|abort)/i.test(text))
          reason = "The download was interrupted. Check your connection, then try again.";
        else
          reason = "Something went wrong while the game was starting. Try again; if it keeps happening, send us a screenshot of this page.";
        document.querySelector("#conquest-fail-reason").textContent = reason;
        document.querySelector("#conquest-fail-detail").textContent = text.slice(0, 300);
        document.querySelector("#conquest-dismiss").style.display = conquestStarted ? "inline-block" : "none";
        document.querySelector("#unity-loading-bar").style.display = "none";
        document.querySelector("#conquest-fail").style.display = "block";
      }
      document.querySelector("#conquest-retry").onclick = function () { location.reload(); };
      document.querySelector("#conquest-dismiss").onclick = function () {
        document.querySelector("#conquest-fail").style.display = "none";
      };

      function unityShowBanner(msg, type) {
        if (type == 'error') { conquestFail(msg); return; }
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      // Build files are hosted on Cloudflare R2 (cdn.vitalinsights.com.au), not
      // GitHub Pages: WebGL.data outgrew GitHub Pages' Git-LFS serving ceiling
      // (150MB+, consistent 503 on every fresh fetch) — see CLAUDE.md 29/08/2026.
      var buildUrl = "https://cdn.vitalinsights.com.au/Build";
      // Loader sempre fresco (26/09/2026): o navegador reaproveitava um WebGL.loader.js antigo
      // do cache HTTP (sem o descompressor) contra arquivos novos comprimidos — "Failed to parse
      // binary data file ... still gzip-compressed". O resto passa pelo cache do Unity, que
      // revalida pelo ETag a cada abertura (cacheControl abaixo): baixa de novo só o que mudou.
      var loaderUrl = buildUrl + "/WebGL.loader.js?v=" + Date.now();
      var config = {
        arguments: [],
        cacheControl: function (url) { return "must-revalidate"; },
        dataUrl: buildUrl + "/WebGL.data",
        // ?v= também aqui (26/09/2026): o loader novo baixa o framework via fetch com CORS, mas
        // a Cloudflare guardava a versão pedida pelo loader antigo como <script> (sem o header
        // Access-Control-Allow-Origin) e devolvia essa → erro de CORS. Endereço novo a cada
        // abertura nunca bate nessa cópia; o arquivo é pequeno.
        frameworkUrl: buildUrl + "/WebGL.framework.js?v=" + Date.now(),
        codeUrl: buildUrl + "/WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "The_Conquest_Client",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        // 01/10/2026 (Lucas, iPhone Safari): tapping Safari's own Share icon threw a
        // one-time "script error" popup with a Close button, the very first tap per page
        // load, whether the game had finished loading or not — Close still leaves Add to
        // Home Screen etc. working fine right after. Best-reasoned cause: Safari tries to
        // snapshot the page (including the WebGL <canvas>) for the share-sheet link
        // preview, and Unity's default WebGL context doesn't keep the previous frame's
        // buffer around for readback (preserveDrawingBuffer defaults to false, the
        // cheaper choice). Turning it on lets that snapshot actually read real pixels
        // instead of failing.
        preserveDrawingBuffer: true,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // ON since 06/10/2026: Career profiles (and replays) are files in persistentDataPath; without this they are lost when the
      // tab closes. Data stays in this browser (clearing the site's data erases it).
      config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        document.documentElement.className = "unity-mobile-page";
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // Keep the game pinned to the real screen after every rotation (25/09/2026).
        // iOS (Safari and home-screen apps alike) reports stale sizes DURING the
        // rotation animation and can leave the page scrolled afterwards — the canvas is
        // then drawn shifted up while taps still land where the buttons "should" be.
        // So after any resize/rotation: size the container to the actual inner window
        // in pixels and undo any scroll, then repeat a few times until the rotation
        // has settled. Unity follows the canvas's DOM size by itself every frame.
        // Skipped while a text field has focus (typing a room code): the on-screen
        // keyboard scrolls the page on purpose, and fighting it would hide the field.
        var container = document.querySelector("#unity-container");
        var fitTimers = [];
        function isTyping() {
          var el = document.activeElement;
          return !!el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable);
        }
        function fitToScreen() {
          if (isTyping()) {
            return;
          }
          var w = Math.round(window.innerWidth);
          var h = Math.round(window.innerHeight);
          if (w > 0 && h > 0) {
            container.style.width = w + "px";
            container.style.height = h + "px";
          }
          if (window.scrollX || window.scrollY) {
            window.scrollTo(0, 0);
          }
          document.documentElement.scrollTop = 0;
          document.body.scrollTop = 0;
        }
        function scheduleFit() {
          fitToScreen();
          for (var i = 0; i < fitTimers.length; i++) {
            clearTimeout(fitTimers[i]);
          }
          fitTimers = [setTimeout(fitToScreen, 150), setTimeout(fitToScreen, 500), setTimeout(fitToScreen, 1000)];
        }
        window.addEventListener("resize", scheduleFit);
        window.addEventListener("orientationchange", scheduleFit);
        window.addEventListener("pageshow", scheduleFit);
        document.addEventListener("focusout", scheduleFit);
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", scheduleFit);
          window.visualViewport.addEventListener("scroll", scheduleFit);
        }
        fitToScreen();

        // Lowered 31/08/2026 (real report: "my phone is going super hot when
        // playing it on safari") — on a Retina/Super-Retina iPhone,
        // devicePixelRatio is 2-3x, so leaving this unset had the WebGL canvas
        // rendering at up to 9x the necessary pixel count (every fragment
        // shader, including the per-pixel hex-tile shader, running that many
        // more times per frame) for a visual gain that barely matters on a
        // strategy board game read at arm's length. Capping to 1 is Unity's
        // own documented mitigation for exactly this symptom.
        //
        // 03/09/2026: this was a hardcoded 1 with no way to test the actual
        // heat-vs-sharpness tradeoff without a rebuild. Now reads a value the
        // in-game Settings screen writes to localStorage (BrowserFullscreen.jslib's
        // SetDprCapHundreds/GetDprCapHundreds) -- defaults to 1x here if nothing's
        // been saved yet, same as before. Changing it in-game only takes effect
        // after a reload (this script only runs once, at boot, before Unity's
        // WebGL context exists), which is why the Settings control there also
        // offers a "reload now" button.
        //
        // 25/09/2026: default is 1.5x now, and every phone is moved to 1.5x once
        // (the "conquest_dpr_v2" flag), even if 1x was saved before. The HUD is
        // laid out in canvas pixels; at 1x a landscape iPhone only gives it 393
        // pixels of height, and its panels simply didn't fit (Lucas: "unplayable
        // in the phone"). The heat reason for 1x no longer applies: the game now
        // draws the 3D board at the same 1x pixel count whatever this is
        // (GraphicsOptions.Apply in the client) and only the HUD uses the extra
        // pixels. Keep this default in sync with BrowserFullscreen.jslib's
        // GetDprCapHundreds. Never above the device's real ratio: that would
        // render more pixels than the screen has.
        var savedDprCap = 1.5;
        try {
          if (localStorage.getItem('conquest_dpr_v2') !== '1') {
            localStorage.setItem('conquest_dpr_cap', '1.5');
            localStorage.setItem('conquest_dpr_v2', '1');
          }
          var raw = parseFloat(localStorage.getItem('conquest_dpr_cap'));
          if (isFinite(raw) && raw > 0) {
            savedDprCap = raw;
          }
        } catch (e) {}
        config.devicePixelRatio = Math.min(savedDprCap, window.devicePixelRatio || 1);


      } else if (/[?&]box/.test(location.search)) {
        // Old desktop style (open the page with ?box): a fixed 960x600 window with the Unity footer.
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      } else {
        // Desktop (06/10/2026, Lucas in Chrome on a 4K monitor: "it gets stuck at 1460x821", the HUD felt tiny): the game fills the whole
        // browser window instead of a fixed 960x600 box. Unity follows the canvas's CSS size every frame, so no resize script is needed.
        document.documentElement.className = "unity-mobile-page";
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      // Texto do carregador (29/10/2026): o Unity chega a 0,9 quando termina de baixar e a 1 quando o jogo abre.
      // Sem avanço por 45 s ainda baixando, avisa que a primeira visita é lenta (não é falha: o jogo continua tentando).
      var conquestStatus = document.querySelector("#conquest-status");
      var conquestLastProgress = -1, conquestLastChange = Date.now();
      var conquestStall = setInterval(function () {
        if (conquestStarted) { clearInterval(conquestStall); return; }
        if (conquestLastProgress < 0.9 && Date.now() - conquestLastChange > 45000)
          conquestStatus.textContent = "Still downloading… the first visit can take a few minutes on a slow connection.";
      }, 5000);

      // Sem WebGL o loader do Unity nem chega a mostrar erro útil: confere antes de baixar 150 MB.
      var conquestGl = null;
      try {
        var probe = document.createElement("canvas");
        conquestGl = probe.getContext("webgl2") || probe.getContext("webgl");
      } catch (e) {}
      if (!conquestGl) {
        conquestFail("WebGL not supported");
      } else {
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onerror = function () { conquestFail("Network: failed to load " + loaderUrl.split("?")[0]); };
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
            if (progress !== conquestLastProgress) { conquestLastProgress = progress; conquestLastChange = Date.now(); }
            conquestStatus.textContent = progress < 0.9
              ? "Loading the board… " + Math.round(100 * progress / 0.9) + "%"
              : "Setting up the table…";
          }).then((unityInstance) => {
            conquestStarted = true;
            document.querySelector("#unity-loading-bar").style.display = "none";
            document.querySelector("#unity-fullscreen-button").onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          }).catch((message) => {
            conquestFail(message);
          });
        };
        document.body.appendChild(script);
      }

    </script>
  </body>
</html>
